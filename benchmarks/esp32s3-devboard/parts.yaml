# Rhoform benchmark (c) ESP32-S3 devboard — full BOM
# MPN VERIFICATION STATUS, stated because the sibling BOMs date theirs and
# silence reads as parity (round 19): these 60 MPNs were transcribed from
# vendor documentation during authoring and have NOT been individually
# verified against live distributor stock in the AMB-123 audit. AMB-126's
# vendor-figure pass is the natural home for that sweep; no offline gate
# can hold MPN existence true.
# Count: 60 total placements = 57 fitted + 3 DNP (J4, R6, R10).
# dnp is only stated where true; absence means fitted.
meta:
  board: esp32s3-devboard-bench-c
  total_components: 60
  fitted: 57
  dnp: 3

components:
  # --- Module / regulator ---
  - ref: U1
    value: ESP32-S3-WROOM-1-N8R2
    package: XCVR_ESP32-S3-WROOM-1
    mpn: ESP32-S3-WROOM-1-N8R2
    role: mcu-module (Wi-Fi/BLE, 8MB flash, 2MB quad PSRAM; NOT simulated — per-mode current stub)
  - ref: U2
    value: AP7361C-33
    package: SOT-223
    mpn: AP7361C-33E-13
    role: 3.3V 1A LDO, VBUS->P3V3

  # --- Connectors / jumpers ---
