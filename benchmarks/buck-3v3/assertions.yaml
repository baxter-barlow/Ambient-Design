# Rhoform benchmark b: 3.3V/2A buck -- dynamic assertions (rung 0, behavioral)
#
# TIMESTEP: the deck ran at `.tran ... 40n` until AMB-123, which is 50 points per
# switching cycle and NOT converged for a 500 kHz PWM comparator with no event
# detection. vout_pp read 7.09 mV against a converged 3.64 mV, il_pp 0.520 A
# against 0.487 A, and overshoot_pct 0.112 % against 0.048 %. design.md
# explained the 9 V corner's 24.4 mVpp as "a slow envelope oscillation" with a
# damping mechanism; at 2 ns that corner reads 3.14 mV and the envelope does not
# exist. It was beat between the duty cycle and the time grid.
#
# Worse, the assertion checker added in the same issue compares `measured:` to
# three significant figures -- so the gate had been made to ENFORCE the
# numerical error, and refining the timestep would have failed `make sim`.
# The deck now runs at 2 ns (5 s wall, inside the 60 s budget) and every
# `measured:` below is from that run.
# Windows are the task defaults; none were widened. Measured values are from
# the canonical `ngspice -b netlist.cir` run recorded in validation.log
# (ngspice-46, 4.9 s wall at the shipped 2 ns timestep).

benchmark: bench-buck
fidelity_class: behavioral
sim_rung: 0
deck: netlist.cir
runtime_budget_s: 60
measured_runtime_s: 5.0

assertions:
  - name: vout_mean
    kind: meas_avg            # .meas tran vout_avg AVG v(out) 2.0m-2.5m, 2 A load
    meas_id: vout_avg
    expected:
      min: 3.201              # 3.3 V - 3%
      max: 3.399              # 3.3 V + 3%
      unit: V
    measured: 3.29600
    status: pass              # -0.12% (feedback divider 31.2k/10k regulation point)

  - name: vout_ripple_pp
    kind: meas_pp             # .meas tran vout_pp PP v(out) 2.4m-2.5m
    meas_id: vout_pp
    expected:
      max: 0.050
      unit: V
    measured: 0.00359
    status: pass

  - name: efficiency
    kind: meas_ratio          # avg(-v(in)*i(V3)) vs avg(v(out)*i(Vsl)), 2.0m-2.5m
    informational_at_rung_0: >-
      Gin injects PFIX/V(in), so eff is a closed form in the hand-entered
      PFIX = 0.40 W and cannot fail for any PFIX <= 1.07 W. It pins the loss
      BUDGET, not switching behaviour, which rung 0 does not model. See
      design.md.
    meas_id: eff
    expected:
      min: 0.85
      unit: ratio
    measured: 0.92864
    status: pass              # conduction losses explicit (DCR 20.4 mOhm max);
                              # 0.40 W fixed-loss budget

  - name: startup_overshoot
    kind: meas_derived        # (max v(out) 0-1.4m / avg v(out) 1.3m-1.5m - 1)*100
    informational_at_rung_0: >-
      Measures the steady-state ripple envelope, not overshoot: the same
      expression over a transient-free window returns the same value, and true
      overshoot here is ~0.01 mV. See design.md.
    meas_id: overshoot_pct
    expected:
      max: 5.0
      unit: percent
    measured: 0.0466
    status: pass              # 500 us soft-start ramp on the reference

  - name: load_step_settling
    kind: meas_when           # last re-entry of +/-1% band after 1A->2A step at 1.5 ms
    meas_id: t_settle_us
    expected:
      max: 500.0
      unit: us
    measured: 16.86
    status: pass

cross_checks:                 # informational, not gating
  - name: inductor_ripple_pp
    meas_id: il_pp
    predicted: 0.479          # Vout*(1-D)/(L*fsw) at Vin=12, ideal D=0.275
    measured: 0.4844
    note: measured duty exceeds ideal D=Vout/Vin to cover modeled IR drops
      (Ron + DCR ~= 26 mOhm)
