# Rhoform benchmark (a): dynamic assertions for the 9V 555 LED blinker
# Measurement kinds use the V2 vocabulary; the two headline assertions
# (frequency, duty) are each backed by ONE .meas TRIG/TARG on v(out).
# settle window: 2 s (V3 ramped-supply fixture; first high phase ~0.86 s
# is startup, excluded). Validation run: ngspice-46, see validation.log.

deck: netlist.cir
settle_window_s: 2.0
analysis: tran 100us 5s

assertions:
  - name: osc_period
    meas_id: t_period
    signal: v(out)
    kind: trig_targ            # one .meas: RISE=1 -> RISE=2, VAL=3.7 V, TD=2 s
    expected: 1.012 s
    window: [0.951 s, 1.083 s]   # 1% R, 5% C AND Ib in [0, 0.5 uA]; see design.md sec. 6
    measured: 1.01191 s
    verdict: PASS

  - name: osc_frequency
    meas_id: f_osc
    signal: v(out)
    kind: derived_param        # 1/t_period from the trig_targ period meas
    expected: 0.988 Hz         # exact ln2 form; 1.44/((RA+2RB)C) = 0.986 Hz
    window: [0.923 Hz, 1.052 Hz] # 1% R, 5% C AND Ib in [0, 0.5 uA]; see design.md sec. 6
    measured: 0.98823 Hz
    verdict: PASS

  - name: duty_cycle_high
    meas_id: duty_pct
    signal: v(out)
    kind: derived_param        # 100*t_on/t_period; t_on is one trig_targ meas
                               #   (RISE=1 -> FALL=1, VAL=3.7 V, TD=2 s)
    expected: 53.42 %          # (RA+RB)/(RA+2RB); passives move it <0.1 pt.
    window: [53.3 %, 55.8 %]   # Ib in [0, 0.25 uA], one-sided. 0.25 uA is the
                               #   GUARANTEED THRES max; an earlier revision used
                               #   0.5 uA, obtained by inverting the datasheet's
                               #   RA+RB ceiling note -- but that guideline sits at
                               #   exactly 1.96x/2.00x the 250 nA max at 5 V/15 V,
                               #   so the 0.5 uA figure IS the guideline's own
                               #   margin, not a current the vendor stands behind.
                               #   See design.md sec. "Duty-cycle window".
    measured: 53.45 %
    verdict: PASS

  - name: led_on_current
    meas_id: i_led_on
    reported_unit: A
    signal: i(VSLED)
    kind: envelope_max         # MAX over the settled window 2..5 s
    expected: 9.5 mA
    window: [8.0 mA, 10.5 mA]  # Vf 1.8-2.2 V, Voh 7.0-7.5 V, RL +/-1%
    measured: 9.257 mA
    verdict: PASS

  - name: out_high_level
    meas_id: v_out_high
    signal: v(out)
    kind: envelope_max         # supplementary sanity check, MAX over 2..5 s
    expected: 7.2 V            # Vcc - 1.7 V minus 12-ohm output-stage drop
    window: [6.8 V, 7.6 V]
    measured: 7.19860 V
    verdict: PASS
