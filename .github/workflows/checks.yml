name: Checks

# Repository gates for AED. Every job is a thin wrapper over a versioned
# script under tests/ so CI and local `make` runs execute identical logic.
# All pins (actions, containers, packages) are recorded with rationale in
# toolchain/versions.yaml; keep the two files in sync in the same change.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Install pinned PyYAML
        # check-layout.sh defers the versions.yaml deep parse when PyYAML
        # is absent; installing it here guarantees the deep-parse gate
        # actually runs in CI. Keep in sync with toolchain/versions.yaml
        # (python.packages).
        run: |
          python3 --version
          python3 -m pip install PyYAML==6.0.2
      - name: Validate monorepo layout invariants
        run: bash tests/structure/check-layout.sh

  schemas:
    name: Schemas and part data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Install pinned schema validator
        # Keep in sync with toolchain/versions.yaml (python.packages).
        run: |
          python3 --version
          python3 -m pip install jsonschema==4.26.0
      - name: Validate schemas and examples
        run: python3 tests/schemas/validate-schemas.py
      - name: Verify part-data lint checks still fire
        # Runs BEFORE the lint itself. A linter whose checks silently
        # stopped firing would otherwise report a clean sweep over every
        # record, which is indistinguishable from having no linter at all.
        run: python3 parts/lint-part-data.py --self-test
      - name: Lint part-data cross-references
        # Invariants JSON Schema has no vocabulary for: provenance pointers
        # resolving, supply draw attributed to real power_in pins, unit
        # membership, sort order, licence containment. Stdlib only.
        run: python3 parts/lint-part-data.py

  bakeoff:
    name: Syntax bake-off
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Round trip, cross-arm agreement, external anchors
        # No install step: the gate is stdlib-only on purpose, so it cannot be
        # weakened by a dependency-resolution problem. Token counting needs
        # the optional tiktoken pin and is NOT gated here — a number nobody
        # can reproduce offline should not decide a merge.
        run: cd lang && python3 -m bakeoff check
      - name: Prototype tests
        run: python3 -m unittest discover -s lang/tests -t lang

  grammar:
    name: Frozen syntax v0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Install the pinned parser generator
        # Unlike the bake-off gate this one is NOT stdlib-only, and cannot be:
        # a Lark artifact that is never handed to Lark is a text file with
        # opinions. Keep in sync with toolchain/versions.yaml.
        run: python3 -m pip install lark==1.3.0
      - name: Artifacts match their source of truth
        run: cd lang && python3 -m grammar.rhoform_syntax --check
      - name: The frozen grammar parses the corpus
        run: cd lang && python3 -m grammar.conformance
      - name: Frozen-syntax tests
        # Runs HERE and not in the bake-off job, which installs nothing: the
        # conformance cases skip themselves without lark, so running them
        # there would report a green suite that never loaded the grammar and
        # never exercised a single negative control.
        run: python3 -m unittest discover -s lang/tests -t lang -p 'test_grammar.py' -v

  eval-harness:
    name: Measurement harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Run harness tests
        # stdlib unittest: no install step, so this job cannot be weakened
        # by a dependency resolution problem.
        run: python3 -m unittest discover -s eval/tests -t eval
      - name: Verify statistics against closed-form values
        run: cd eval && python3 -m aed_eval selftest
      - name: Replay the recorded transcript end to end
        # Exercises the whole protocol offline with no API key and no spend.
        # The transcript carries per-turn request digests, so a change to
        # the prompt or the protocol fails here instead of silently
        # producing results for a run that never happened.
        run: cd eval && python3 -m aed_eval replay --transcript fixtures/demo-replay.json --allow-stub

  benchmarks-sim:
    name: Benchmark simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pinned by digest; the tag is documentation. Keep in sync with
    # toolchain/versions.yaml (ci.containers.simulation).
    container:
      image: debian:testing-20260803-slim@sha256:90e4367c69a75bb80e2f3b043a4bdaf2f0b97eed9bf9bbc05a29af42d3ffdfc2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ngspice
        # Exact package pin from toolchain/versions.yaml (ngspice). apt
        # fails loudly if the snapshot no longer resolves this revision;
        # that failure means the pin must be consciously revisited, never
        # silently upgraded.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ngspice=46+ds-1
          ngspice --version | head -n 5
      - name: Run benchmark decks
        run: bash tests/benchmarks/run-sim.sh

  golden:
    name: Golden files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run golden-file harness
        # The harness exits 0 with "no cases" while tests/golden is empty;
        # once cases exist, any byte-level divergence fails this job.
        continue-on-error: false
        run: bash tests/golden/run.sh
