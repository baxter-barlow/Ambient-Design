name: Checks

# Repository gates for Rhoform. Every job is a thin wrapper over a versioned
# script under tests/ so CI and local `make` runs execute identical logic.
# All pins (actions, containers, packages) are recorded with rationale in
# toolchain/versions.yaml; keep the two files in sync in the same change.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Install pinned PyYAML
        # check-layout.sh FAILS (exit 2) when PyYAML is absent -- an
        # unavailable gate is not a pass -- so this install is what lets the
        # versions.yaml deep parse run at all. The comment here used to say the
        # script "defers" the parse, which describes behaviour it replaced.
        # Keep in sync with toolchain/versions.yaml (python.packages).
        run: |
          python3 --version
          python3 -m pip install PyYAML==6.0.2
      - name: Validate monorepo layout invariants
        run: |
          python3 tests/structure/check-retired-names.py --self-test
          bash tests/structure/check-layout.sh
      - name: AC2 corpus contents
        # The population AC2 is measured over. Until AMB-123 nothing gated it:
        # an entry could lose its source, its root cause and its evidence and
        # stay green, and the classification's decision_hash would not move
        # because that hash covers classification.yaml only.
        run: |
          python3 tests/corpus/check-corpus.py --self-test
          python3 tests/corpus/check-corpus.py
      - name: AC2 corpus classification and freeze
        # Here rather than in the schemas job because this is the job that
        # already installs PyYAML, which this gate needs. Putting it in
        # `schemas` would have meant a second PyYAML install and a stale
        # toolchain/versions.yaml, and that manifest is outside AMB-36's path
        # claim. The gate's own dependencies beyond PyYAML are stdlib: it reads
        # parts/part-data.schema.json as JSON and imports the frozen grammar
        # module, which needs no parser generator.
        run: |
          python3 tests/corpus/check-classification.py --self-test
          python3 tests/corpus/check-classification.py

  schemas:
    name: Schemas and part data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Install pinned schema validator
        # Keep in sync with toolchain/versions.yaml (python.packages).
        run: |
          python3 --version
          python3 -m pip install jsonschema==4.26.0
      - name: Verify the schema gate can fail
        run: python3 tests/schemas/validate-schemas.py --self-test
      - name: Validate schemas and examples
        run: python3 tests/schemas/validate-schemas.py
      - name: Verify part-data lint checks still fire
        # Runs BEFORE the lint itself. A linter whose checks silently
        # stopped firing would otherwise report a clean sweep over every
        # record, which is indistinguishable from having no linter at all.
        run: python3 parts/lint-part-data.py --self-test
      - name: IR content hashes
        # Proves `design_hash` describes its own bytes and the source map
        # agrees. Stdlib only. The self-test runs first so a check that
        # stopped firing fails loudly instead of reporting a clean sweep.
        run: |
          python3 tests/ir/check-hashes.py --self-test
          python3 tests/ir/check-hashes.py

      - name: Lint part-data cross-references
        # Invariants JSON Schema has no vocabulary for: provenance pointers
        # resolving, supply draw attributed to real power_in pins, unit
        # membership, sort order, licence containment. Stdlib only.
        run: python3 parts/lint-part-data.py

  bakeoff:
    name: Syntax bake-off
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Round trip, cross-arm agreement, external anchors
        # No install step: the gate is stdlib-only on purpose, so it cannot be
        # weakened by a dependency-resolution problem. Token counting needs
        # the optional tiktoken pin and is NOT gated here — a number nobody
        # can reproduce offline should not decide a merge.
        run: cd lang && python3 -m bakeoff check
      - name: Prototype tests
        # `-p 'test_bakeoff.py'` because the default `test*.py` pattern also
        # collects test_grammar.py, which this job installs no lark for: 16 of
        # its 39 cases ran here and reported OK, in a job whose own comment says
        # running them here "would report a green suite that never loaded the
        # grammar". The grammar job runs the full 39 with lark present.
        run: python3 -m unittest discover -s lang/tests -t lang -p 'test_bakeoff.py'

  grammar:
    name: Frozen syntax v0
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Install the pinned parser generator
        # Unlike the bake-off gate this one is NOT stdlib-only, and cannot be:
        # a Lark artifact that is never handed to Lark is a text file with
        # opinions. Keep in sync with toolchain/versions.yaml.
        run: python3 -m pip install lark==1.3.0
      - name: Artifacts match their source of truth
        run: cd lang && python3 -m grammar.rhoform_syntax --check
      - name: The frozen grammar parses the corpus
        run: cd lang && python3 -m grammar.conformance
      - name: Frozen-syntax tests
        # Runs HERE and not in the bake-off job, which installs nothing: the
        # conformance cases skip themselves without lark, so running them
        # there would report a green suite that never loaded the grammar and
        # never exercised a single negative control.
        run: python3 -m unittest discover -s lang/tests -t lang -p 'test_grammar.py' -v

  eval-harness:
    name: Measurement harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep in sync with toolchain/versions.yaml (python.version).
          python-version: "3.12"
      - name: Recorded runs are internally consistent
        # The schema proves shape; it has no arithmetic. An audit built eleven
        # dishonest records from the committed demo run — a 64K context passing
        # a 12K limit, a gate passing at 2/10, 99 successes in 10 trials — and
        # the schema accepted every one.
        run: |
          python3 tests/eval/check-run-records.py --self-test
          python3 tests/eval/check-run-records.py
      - name: Run harness tests
        # stdlib unittest: no install step, so this job cannot be weakened
        # by a dependency resolution problem.
        run: python3 -m unittest discover -s eval/tests -t eval
      - name: Verify statistics against closed-form values
        run: cd eval && python3 -m rhoform_eval selftest
      - name: Replay the recorded transcript end to end
        # Exercises the whole protocol offline with no API key and no spend.
        # The transcript carries per-turn request digests, so a change to
        # the prompt or the protocol fails here instead of silently
        # producing results for a run that never happened.
        run: cd eval && python3 -m rhoform_eval replay --transcript fixtures/demo-replay.json --allow-stub

  toolchain-pins:
    name: Toolchain pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install PyYAML==6.0.2
      - name: Self-test the pin gate
        run: python3 tests/toolchain/check-pins.py --self-test
      - name: Every pin agrees with its consumer
        run: python3 tests/toolchain/check-pins.py
      - name: Resolve the pinned KiCad digests
        # AMB-28's criterion is "pinned kicad/kicad + ngspice Docker images in
        # CI". The ngspice half has been real since day one; the kicad half was
        # two digests nothing had ever resolved. `manifest inspect` proves the
        # digest exists and is what the tag points at, WITHOUT pulling several
        # gigabytes on every PR — running kicad-cli against real exports is
        # AMB-66's work, not this criterion's.
        #
        # These two lines are also the consumer that tests/toolchain/check-pins.py
        # requires, so a manifest edit that is not reflected here fails offline
        # before this job ever runs.
        run: |
          set -euo pipefail
          for ref in \
            kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729 \
            kicad/kicad:10.0.5@sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de
          do
            echo "resolving $ref"
            docker manifest inspect "$ref" > /dev/null
          done
          echo "both pinned KiCad digests resolve."

  benchmarks-sim:
    name: Benchmark simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pinned by digest; the tag is documentation. Keep in sync with
    # toolchain/versions.yaml (ci.containers.simulation).
    container:
      image: debian:testing-20260803-slim@sha256:90e4367c69a75bb80e2f3b043a4bdaf2f0b97eed9bf9bbc05a29af42d3ffdfc2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ngspice
        # Exact package pin from toolchain/versions.yaml (ngspice). apt
        # fails loudly if the snapshot no longer resolves this revision;
        # that failure means the pin must be consciously revisited, never
        # silently upgraded.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ngspice=46+ds-1
          ngspice --version | head -n 5
      - name: Install Python and PyYAML for the assertion check
        # tests/benchmarks/check-assertions.py reads benchmarks/*/assertions.yaml.
        # Installed explicitly rather than relied on: the checker exits 2 without
        # PyYAML (an unavailable gate is not a pass), so a missing dependency
        # here fails the job loudly instead of skipping the value comparison.
        # Keep in sync with toolchain/versions.yaml (python.packages.pyyaml).
        run: |
          # Debian testing's python3/python3-yaml are NOT the pins in
          # toolchain/versions.yaml, and this is the one job that produces
          # numeric results. The assertion checkers are stdlib + PyYAML only and
          # their behaviour does not vary across these versions, but the
          # divergence is recorded rather than described as "in sync".
          apt-get install -y --no-install-recommends python3 python3-yaml
          python3 -c "import sys, yaml; print('sim job interpreter', sys.version.split()[0], 'PyYAML', yaml.__version__, '(NOT the pinned versions; see comment)')"
          python3 -c "import yaml, sys; print('python', sys.version.split()[0], 'PyYAML', yaml.__version__)"
      - name: Self-test the assertion checkers
        run: |
          python3 tests/benchmarks/check-assertions.py --self-test
          python3 tests/benchmarks/check-hand-assertions.py --self-test
          python3 tests/benchmarks/derive-555-windows.py --check
          python3 tests/benchmarks/check-design-docs.py --self-test
          python3 tests/benchmarks/check-design-docs.py
          python3 tests/benchmarks/check-corners.py --self-test
          python3 tests/benchmarks/check-corners.py
          python3 lang/tests/check_readme_numbers.py --self-test
          python3 lang/tests/check_readme_numbers.py
      - name: Run benchmark decks and check their assertion windows
        run: bash tests/benchmarks/run-sim.sh

  golden:
    name: Golden files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run golden-file harness
        # The harness exits 0 with "no cases" while tests/golden is empty;
        # once cases exist, any byte-level divergence fails this job.
        continue-on-error: false
        run: bash tests/golden/run.sh
