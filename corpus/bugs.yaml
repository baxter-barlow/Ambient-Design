- id: BUG-0053
  title: AMS1117 unstable with low-ESR ceramic-only output capacitor
  source:
    url: https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/8122/AMS11173.3SOT223.pdf
    kind: vendor_erratum
  symptom: 'Datasheet-caveat entry: stability is only specified with the required tantalum output capacitor, so
    ceramic-only output-capacitor designs operate outside the datasheet''s stated stability conditions. The cited
    source documents the requirement, not a specific observed field failure.'
  root_cause: Output-capacitor selection outside the datasheet's frequency-compensation requirements; the AMS1117
    datasheet requires a minimum 10uF tantalum output capacitor for stability and states the capacitor's ESR must
    not exceed 0.5 ohm, and it does not qualify ceramic-only output capacitors.
  category: ldo-output-cap-esr-instability
  class: power-supply
  evidence: 'Datasheet-caveat (requirement stated by datasheet, not an observed failure report), re-verified from
    downloaded PDF 2026-08-15: "A minimum of 10uF tantalum capacitor is required at the output to improve the transient
    response and stability" (p.1); output-capacitor section: "Typically, a 10uF tantalum or 50uF aluminum electrolytic
    is sufficient... It is important that the ESR for this capacitor does not exceed 0.5 Ohm."'
  collected: '2026-08-14'
- id: BUG-0054
  title: CP2102/9 VBUS tied directly to 5V without required divider (abs-max violation)
  source:
    url: https://www.silabs.com/documents/public/data-sheets/CP2102-9.pdf
    kind: vendor_erratum
  symptom: 'Datasheet-caveat entry: in self-powered designs where VDD/REGIN may be unpowered while USB 5V is present,
    tying VBUS directly to 5V exceeds the CP2109 absolute-maximum VBUS rating (VDD+3.6V with VDD not powered). The
    cited source documents the requirement, not a specific observed field failure.'
  root_cause: CP2109 abs-max on VBUS is VDD+3.6V when VDD is not powered; datasheet section 10 and Note 1 of Figures
    8/10 require a resistor divider (47k/24k shown) on VBUS for such self-powered systems. The bus-powered reference
    figure shows no divider, making the omission easy.
  category: abs-max-violation
  class: usb
  evidence: 'Datasheet-caveat (requirement stated by datasheet, not an observed failure report), re-verified from
    downloaded PDF rev 1.8 on 2026-08-15: "a resistor divider (or functionally-equivalent circuit) on VBUS is required
    to meet the absolute maximum voltage on VBUS specification" (Note 1, p.20, Figure 8, divider 47k/24k); Table
    2 CP2109 abs-max on VBUS with "VDD not powered" is VDD+3.6V.'
  collected: '2026-08-14'
- id: BUG-0055
  title: TL072 buffers with floating inputs overheat and back-drive ADC
  source:
    url: https://forum.allaboutcircuits.com/threads/tl072-op-amp-voltage-follower-acts-weird.181020/
    kind: forum_postmortem
  symptom: TL072 voltage follower on +/-15V overheated severely; ~33 mA flowed from op-amp output into ADS1115 ADC
    input, only when ADC was connected.
  root_cause: Floating high-impedance inputs let the output slam to a supply rail; the 15V rail-level output drove
    the 5V ADC's input protection clamps, sinking destructive current. Fixed with 10 Mohm pull-downs plus feedback
    resistor and bypass caps.
  category: floating-input-pins
  class: pin-config
  evidence: '"When you let the + input of an opamp that has a +15V and -15V power supply float, it might oscillate
    or float to +15V or -15V."'
  collected: '2026-08-14'
- id: BUG-0056
  title: NE555 astable locks up from missing supply decoupling capacitor
  source:
    url: https://forum.allaboutcircuits.com/threads/troubleshooting-ne555-astable-operation.148618/
    kind: forum_postmortem
  symptom: 600 Hz PWM ran for 10-20 seconds, then pin 3 output stuck at a constant 5V with no switching.
  root_cause: No decoupling/bulk capacitor across pins 1-8; supply noise upset the internal comparators. Adding
    the datasheet-recommended 1 uF electrolytic across the supply pins fixed it permanently.
  category: missing-decoupling-cap
  class: power-supply
  evidence: 'OP confirmed fix: "after i used 1uF capacitor as described i am running PWM signal without stop for
    last 2 hours."'
  collected: '2026-08-14'
- id: BUG-0057
  title: Comparator hysteresis returned to wrong input causes relay chatter
  source:
    url: https://forum.allaboutcircuits.com/threads/hysteresis-on-buffered-comparator-input-signal.85545/
    kind: forum_postmortem
  symptom: RC-timer relay circuit short-cycled audibly ("you should've heard that poor little relay"); comparator
    node chaotic and wouldn't settle after adding a hysteresis pot.
  root_cause: Hysteresis divider was wired to the inverting input, creating negative feedback instead of a Schmitt
    trigger. Swapping signal to inverting input and feedback to non-inverting input gave true positive-feedback
    hysteresis.
  category: comparator-hysteresis-miswired
  class: analog-stability
  evidence: '"By leading the input signal to the inverted input and the hysteresis arrangement to the non-inverting
    input, the amplifier stabilized due to positive feedback."'
  collected: '2026-08-14'
- id: BUG-0058
  title: Class AB output stage thermal runaway from uncoupled bias diodes
  source:
    url: https://forum.allaboutcircuits.com/threads/class-ab-amplifier-over-heating-puzzle.135982/
    kind: forum_postmortem
  symptom: On 2 of 9 identical amplifier circuits, output transistor temperature rose without limit within 60 seconds,
    despite clean sine output; other 7 stayed cold.
  root_cause: 'Bias diodes not thermally coupled to output transistors and no emitter degeneration: Vbe drops as
    devices heat while bias stays fixed, so quiescent current runs away; device tolerance spread explains 2-of-9.
    Fix: 1-ohm emitter resistors.'
  category: thermal-runaway-bias
  class: thermal
  evidence: '"A 1 ohm emitter resistor give a mV of negative-feedback difference for a mA of current change, providing
    a strong stabilizing effect to the emitter current."'
  collected: '2026-08-14'
- id: BUG-0059
  title: External source hard-wired to AREF shorts internal ADC reference
  source:
    url: https://forum.arduino.cc/t/is-my-aref-damaged/427294
    kind: forum_postmortem
  symptom: After wiring the 3.3V rail directly to AREF on a Mega 2560, AREF measures 5V regardless of selected reference
    mode (1.1V, 2.56V, external) - reference circuit damaged.
  root_cause: analogRead() before analogReference(EXTERNAL) drives the internal reference onto AREF against the
    stiff external 3.3V source, shorting them; design needs a series resistor (or never hard-wiring a source to
    a reference output pin).
  category: adc-reference-conflict
  class: pin-config
  evidence: 'Poster: measured AREF "5v Vcc regardless" of reference setting; docs warning cited in thread: "this
    can possibly damage the Arduino".'
  collected: '2026-08-14'
- id: BUG-0060
  title: AD8066 buffer oscillates from negative input impedance with inductive source
  source:
    url: https://www.electronics-related.com/showthread/sci.electronics.design/641793-1.php
    kind: mailing_list
  symptom: Unity-gain AD8066 coax driver oscillated vigorously at ~50 MHz when input was shorted with a clip lead;
    frequency ranged 6.5-116 MHz tracking source inductance.
  root_cause: 'The buffer''s input impedance has a negative real part at HF (input capacitance plus feedback phase
    lag), forming an undamped resonance with any inductive source. Fix: ~400 ohm series R plus 3.3 pF shunt at the
    non-inverting input.'
  category: opamp-stability
  class: analog-stability
  evidence: '"It seems like the input impedance of this buffer has a negative real part" (diagnosis in thread).'
  collected: '2026-08-14'
- id: BUG-0061
  title: 'LTC6241 buffer oscillates at 405 kHz: 1 Mohm feedback with no CF'
  source:
    url: https://electronics.stackexchange.com/questions/413450/this-op-amp-buffer-is-oscillating-and-i-cant-figure-out-why
    kind: qa_site
  symptom: Inverting unity buffer (LTC6241HV, 1 Mohm resistors) output showed a ~405 kHz sine superimposed on the
    1 kHz signal; identical on a second PCB.
  root_cause: Megohm feedback resistance forms an in-loop pole with the op-amp's input capacitance, destroying phase
    margin at unity gain; the required feedback capacitor was missing. OP confirmed 15 pF across RF fixed it.
  category: opamp-stability
  class: analog-stability
  evidence: 'Accepted answer quoting LTC datasheet: "this pole can create excess phase shift and possibly oscillation.
    A small capacitor CF in parallel with RF eliminates this problem."'
  collected: '2026-08-14'
- id: BUG-0062
  title: 'Single-supply inverting amp clips: non-inverting input not biased to mid-rail'
  source:
    url: https://electronics.stackexchange.com/questions/90840/op-amp-output-clipped
    kind: qa_site
  symptom: uA741 inverting amplifier on a single 5V supply produced a flat-topped, constrained output; clipping
    persisted even with the feedback resistor removed.
  root_cause: Non-inverting input referenced to 0V instead of a mid-supply virtual ground, so equilibrium requires
    output swing below ground; compounded by the 741's non-rail-to-rail swing on 5V.
  category: opamp-biasing
  class: analog-stability
  evidence: 'Answer: "You have to tie noninverting input to a midpoint between the rails. 2.5V in this particular
    case."'
  collected: '2026-08-14'