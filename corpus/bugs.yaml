  symptom: CH340 designs run at 3.3V with V3 wired only to a decoupling cap work marginally; V3 rail sags under
    load, risking unreliable operation.
  root_cause: WCH datasheet requires V3 tied to VCC when VCC=3.3V (cap-only wiring is the 5V configuration); the
